<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Free Claude AI chatbot powered by Puter.js — no API key needed">
<title>Claude Chat</title>
<style>
  :root {
    --bg:       #111118;
    --surface:  #1c1c28;
    --border:   #2e2e44;
    --text:     #e2e2f0;
    --muted:    #6a6a8a;
    --accent:   #8b5cf6;
    --accent-h: #7c3aed;
    --green:    #4ade80;
    --red:      #f87171;
    --user-bg:  #8b5cf6;
    --bot-bg:   #1c1c28;
    --radius:   14px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;          /* dvh = handles mobile browser chrome correctly */
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── TOP BAR ── */
  .topbar {
    position: relative;
    padding: 12px 16px 10px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-shrink: 0;
  }
  /* Signature: thin shimmer line across the very top */
  .topbar::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, #8b5cf6, #6366f1, #06b6d4, #8b5cf6);
    background-size: 200% 100%;
    animation: shimmer 4s linear infinite;
  }
  @keyframes shimmer {
    0%   { background-position: 0% 0%; }
    100% { background-position: 200% 0%; }
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .logo {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .title-block h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
  .status-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #3a3a55;
    display: inline-block;
    margin-right: 3px;
    transition: background 0.3s;
  }
  .dot.ok   { background: var(--green); }
  .dot.fail { background: var(--red);   }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  #btn-clear {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: color 0.2s, border-color 0.2s;
  }
  #btn-clear:hover { color: var(--text); border-color: var(--muted); }

  /* ── TOOLBAR ── */
  .toolbar {
    padding: 8px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  #btn-signin {
    padding: 7px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
    transition: background 0.2s, color 0.2s;
    min-height: 36px;
  }
  #btn-signin:hover:not(:disabled) { background: var(--accent); color: #fff; }
  #btn-signin:disabled {
    border-color: var(--green);
    color: var(--green);
    cursor: default;
  }

  select {
    flex: 1;
    min-width: 0;
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    min-height: 36px;
    cursor: pointer;
  }
  select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .stream-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .stream-toggle input { cursor: pointer; accent-color: var(--accent); }

  /* ── CHAT AREA ── */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }

  /* Empty state */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 32px 16px;
    pointer-events: none;
  }
  .empty-state .big { font-size: 36px; margin-bottom: 4px; }
  .empty-state strong { color: var(--text); font-size: 16px; }

  /* Messages */
  .msg-wrap {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .msg-wrap.user  { align-items: flex-end; }
  .msg-wrap.bot   { align-items: flex-start; }

  .msg {
    max-width: min(78%, 520px);
    padding: 10px 13px;
    border-radius: var(--radius);
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
    position: relative;
  }
  .msg-wrap.user .msg {
    background: var(--user-bg);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg-wrap.bot .msg {
    background: var(--bot-bg);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg-wrap.bot .msg.loading {
    color: var(--muted);
    font-style: italic;
  }
  .msg-wrap.bot .msg.error {
    border-color: var(--red);
    color: var(--red);
  }

  /* Typing dots animation */
  .typing-dots {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    height: 18px;
  }
  .typing-dots span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s ease-in-out infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30%           { transform: translateY(-6px); }
  }

  /* Copy button (appears on hover/tap on bot message) */
  .copy-btn {
    font-size: 11px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    font-family: inherit;
    align-self: flex-start;
    margin-left: 4px;
    opacity: 0;
    transition: opacity 0.2s, color 0.2s;
  }
  .msg-wrap.bot:hover .copy-btn,
  .msg-wrap.bot:focus-within .copy-btn,
  .copy-btn.visible { opacity: 1; }
  .copy-btn:hover { color: var(--text); }

  /* ── INPUT FOOTER ── */
  footer {
    padding: 10px 12px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    gap: 8px;
    flex-shrink: 0;
  }

  #prompt {
    flex: 1;
    padding: 10px 13px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;   /* 16px prevents iOS zoom-on-focus */
    resize: none;
    font-family: inherit;
    outline: none;
    max-height: 120px;
    line-height: 1.4;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  #prompt:focus { border-color: var(--accent); }
  #prompt::placeholder { color: var(--muted); }

  #btn-send {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.2s, opacity 0.2s;
    /* always 42×42 so it's a large tap target on mobile */
  }
  #btn-send:hover:not(:disabled) { background: var(--accent-h); }
  #btn-send:disabled { opacity: 0.4; cursor: default; }

  /* ── DEBUG LOG ── */
  details#debugwrap {
    border-top: 1px solid var(--border);
    background: var(--bg);
    flex-shrink: 0;
  }
  details#debugwrap summary {
    padding: 7px 14px;
    font-size: 11.5px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    list-style: none;
  }
  #copy-log {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  #debug {
    max-height: 110px;
    overflow-y: auto;
    padding: 6px 14px 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--muted);
    white-space: pre-wrap;
  }
  .log-error { color: var(--red); }

  /* ── RESPONSIVE: wider screens get slightly wider messages ── */
  @media (min-width: 600px) {
    #chat { padding: 20px; }
    .msg  { font-size: 15px; }
    .topbar { padding: 14px 20px 12px; }
    .toolbar { padding: 10px 20px; }
    footer   { padding: 12px 20px; }
  }

  /* ── REDUCED MOTION ── */
  @media (prefers-reduced-motion: reduce) {
    .topbar::before { animation: none; }
    .typing-dots span { animation: none; opacity: 0.5; }
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
  <div class="topbar-left">
    <div class="logo">✦</div>
    <div class="title-block">
      <h1>Claude Chat</h1>
      <div class="status-row">
        <span><span id="dot-sdk" class="dot"></span>SDK</span>
        <span><span id="dot-auth" class="dot"></span>Signed in</span>
      </div>
    </div>
  </div>
  <div class="topbar-right">
    <button id="btn-clear" title="Clear chat">Clear</button>
  </div>
</header>

<!-- TOOLBAR -->
<div class="toolbar">
  <button id="btn-signin">Sign in to Puter</button>
  <select id="model" title="Choose Claude model">
    <option value="claude-sonnet-4-6">Sonnet 4.6</option>
    <option value="claude-opus-4-8" selected>Opus 4.8</option>
    <option value="claude-haiku-4-5">Haiku 4.5</option>
  </select>
  <label class="stream-toggle" title="Stream response word by word">
    <input type="checkbox" id="stream" checked> Stream
  </label>
</div>

<!-- CHAT -->
<div id="chat">
  <div class="empty-state" id="empty">
    <div class="big">✦</div>
    <strong>Claude Chat</strong>
    <span>Sign in to Puter above, then ask anything.</span>
    <span style="font-size:12px;margin-top:4px;">Free · No API key needed · Powered by Puter.js</span>
    <span style="font-size:12px;">⚠️ No memory between messages — each reply starts fresh</span>
  </div>
</div>

<!-- INPUT -->
<footer>
  <textarea id="prompt" rows="1" placeholder="Sign in first, then type here…" aria-label="Message input"></textarea>
  <button id="btn-send" aria-label="Send message">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"></line>
      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
    </svg>
  </button>
</footer>

<!-- DEBUG LOG -->
<details id="debugwrap">
  <summary>
    Debug log — paste this to Claude if something breaks
    <button id="copy-log" type="button">Copy</button>
  </summary>
  <div id="debug"></div>
</details>

<script src="https://js.puter.com/v2/"></script>
<script>
// ── Elements ────────────────────────────────────────────────
const chatEl    = document.getElementById('chat');
const emptyEl   = document.getElementById('empty');
const promptEl  = document.getElementById('prompt');
const sendBtn   = document.getElementById('btn-send');
const clearBtn  = document.getElementById('btn-clear');
const modelEl   = document.getElementById('model');
const streamEl  = document.getElementById('stream');
const signinBtn = document.getElementById('btn-signin');
const debugEl   = document.getElementById('debug');
const dotSdk    = document.getElementById('dot-sdk');
const dotAuth   = document.getElementById('dot-auth');
let sdkReady = false;

// ── Debug log ───────────────────────────────────────────────
function log(msg, isError) {
  const t = new Date().toLocaleTimeString();
  const d = document.createElement('div');
  d.textContent = '[' + t + '] ' + msg;
  if (isError) d.className = 'log-error';
  debugEl.appendChild(d);
  debugEl.scrollTop = debugEl.scrollHeight;
}
window.addEventListener('error', e => log('JS error: ' + e.message, true));
window.addEventListener('unhandledrejection', e => {
  log('Unhandled rejection: ' + (e.reason?.message || e.reason), true);
});

document.getElementById('copy-log').addEventListener('click', () => {
  const txt = debugEl.innerText;
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(txt).then(() => log('Log copied.')).catch(copyFallback.bind(null, txt));
  } else { copyFallback(txt); }
});
function copyFallback(txt) {
  const ta = document.createElement('textarea');
  ta.value = txt;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); log('Log copied.'); }
  catch { log('Could not auto-copy — select the text manually.', true); }
  document.body.removeChild(ta);
}

// ── Auth helpers ────────────────────────────────────────────
function refreshAuthUI() {
  if (!sdkReady) return;
  let in_ = false;
  try { in_ = puter.auth.isSignedIn(); } catch(e) { log('isSignedIn error: ' + e.message, true); }
  dotAuth.className = 'dot' + (in_ ? ' ok' : '');
  signinBtn.textContent = in_ ? 'Signed in ✓' : 'Sign in to Puter';
  signinBtn.disabled = in_;
}

function waitForSDK(n) {
  if (typeof puter !== 'undefined') {
    sdkReady = true;
    dotSdk.className = 'dot ok';
    log('Puter SDK loaded.');
    refreshAuthUI();
  } else if (n > 0) {
    setTimeout(() => waitForSDK(n - 1), 300);
  } else {
    dotSdk.className = 'dot fail';
    log('Puter SDK never loaded. Check internet / ad-blocker.', true);
  }
}
log('Page loaded, waiting for Puter SDK...');
waitForSDK(20);

signinBtn.addEventListener('click', async () => {
  if (!sdkReady) { log('SDK not ready yet.', true); return; }
  log('Opening Puter sign-in popup...');
  try { await puter.auth.signIn(); log('Signed in.'); }
  catch(e) { log('Sign-in error: ' + (e?.message || e), true); }
  refreshAuthUI();
});

// ── Chat helpers ────────────────────────────────────────────
function hideEmpty() {
  if (emptyEl) emptyEl.style.display = 'none';
}

function addMessage(role, content) {
  hideEmpty();
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ' + (role === 'user' ? 'user' : 'bot');

  const bubble = document.createElement('div');
  bubble.className = 'msg';

  if (content === '__typing__') {
    bubble.className += ' loading';
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  } else {
    bubble.textContent = content;
  }

  wrap.appendChild(bubble);

  // Copy button for bot messages
  if (role === 'bot') {
    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.textContent = 'Copy';
    copyBtn.addEventListener('click', () => {
      const txt = bubble.textContent;
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(txt).then(() => {
          copyBtn.textContent = 'Copied!';
          setTimeout(() => copyBtn.textContent = 'Copy', 1500);
        }).catch(() => copyFallback(txt));
      } else { copyFallback(txt); }
    });
    // Show copy button on touch devices always
    if ('ontouchstart' in window) copyBtn.classList.add('visible');
    wrap.appendChild(copyBtn);
  }

  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  return bubble;
}

function extractText(r) {
  if (typeof r === 'string') return r;
  if (r?.message?.content) {
    const c = r.message.content;
    if (typeof c === 'string') return c;
    if (Array.isArray(c)) return c.map(x => x.text || '').join('');
  }
  if (typeof r?.text === 'string') return r.text;
  try { return String(r); } catch { return JSON.stringify(r); }
}

// ── Send ─────────────────────────────────────────────────────
async function sendPrompt() {
  const text = promptEl.value.trim();
  if (!text) return;
  if (!sdkReady) { log('SDK not ready.', true); return; }

  addMessage('user', text);
  promptEl.value = '';
  promptEl.style.height = 'auto';
  sendBtn.disabled = true;

  const bubble = addMessage('bot', '__typing__');
  const useStream = streamEl.checked;
  const model = modelEl.value;
  log('Sending to ' + model + (useStream ? ' [stream]' : '') + '...');

  try {
    if (useStream) {
      const res = await puter.ai.chat(text, { model, stream: true });
      bubble.innerHTML = '';
      let got = false;
      for await (const part of res) {
        const chunk = part?.text
          || part?.message?.content?.[0]?.text
          || '';
        if (chunk) { got = true; bubble.textContent += chunk; chatEl.scrollTop = chatEl.scrollHeight; }
      }
      if (!got) bubble.textContent = '(empty response)';
      log('Stream done.');
    } else {
      const res = await puter.ai.chat(text, { model });
      bubble.innerHTML = '';
      bubble.textContent = extractText(res);
      log('Response received.');
    }
  } catch(e) {
    bubble.classList.add('error');
    bubble.innerHTML = '';
    const msg = e?.message || e?.error?.message || String(e);
    bubble.textContent = 'Error: ' + msg;
    log('Request failed: ' + msg, true);
  } finally {
    sendBtn.disabled = false;
    promptEl.focus();
    refreshAuthUI();
  }
}

sendBtn.addEventListener('click', sendPrompt);

promptEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendPrompt();
  }
});

promptEl.addEventListener('input', () => {
  promptEl.style.height = 'auto';
  promptEl.style.height = Math.min(promptEl.scrollHeight, 120) + 'px';
});

// ── Clear chat ───────────────────────────────────────────────
clearBtn.addEventListener('click', () => {
  chatEl.innerHTML = '';
  chatEl.appendChild(emptyEl);
  emptyEl.style.display = '';
  log('Chat cleared.');
});
</script>
</body>
</html>
